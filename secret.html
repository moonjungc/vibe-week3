<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>비밀 메모장</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--
    보안 수업 실습용 페이지입니다.
    의도적으로 넣었던 취약점 3가지(비밀번호 하드코딩, innerHTML 미이스케이프, console.log 노출)를
    직접 찾아 고치는 실습을 완료한 버전입니다.
  -->
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ffe4ec 0%, #e6e6fa 50%, #d6f5f0 100%);
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      padding: 40px 20px;
    }

    .card {
      background: #fffafc;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(200, 170, 220, 0.35);
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
    }

    h1 {
      margin: 0 0 6px;
      color: #7a5c7e;
      font-size: 1.5rem;
      text-align: center;
    }

    .intro {
      color: #806a87;
      font-size: 0.9rem;
      text-align: center;
      margin-bottom: 24px;
    }

    input, textarea, button {
      font-family: inherit;
    }

    .lock-row {
      display: flex;
      gap: 8px;
    }

    #passwordInput {
      flex: 1;
      font-size: 0.9rem;
      color: #5a4b66;
      border: 1.5px solid #f0d6e5;
      border-radius: 12px;
      padding: 10px 12px;
      outline: none;
      background: #ffffff;
    }

    #passwordInput:focus {
      border-color: #f7a8c4;
    }

    #unlockBtn, #addNoteBtn {
      font-size: 0.9rem;
      font-weight: 600;
      color: #ffffff;
      background: #f7a8c4;
      border: none;
      border-radius: 12px;
      padding: 10px 16px;
      cursor: pointer;
      white-space: nowrap;
    }

    #unlockBtn:hover, #addNoteBtn:hover {
      background: #f291b6;
    }

    .error-message {
      color: #d1607b;
      font-size: 0.85rem;
      margin-top: 10px;
      text-align: center;
      min-height: 1.2em;
    }

    #noteApp {
      display: none;
    }

    #noteInput {
      width: 100%;
      min-height: 70px;
      resize: vertical;
      font-size: 0.9rem;
      color: #5a4b66;
      border: 1.5px solid #f0d6e5;
      border-radius: 12px;
      padding: 10px 12px;
      outline: none;
      background: #ffffff;
      margin-bottom: 10px;
    }

    #noteInput:focus {
      border-color: #f7a8c4;
    }

    #addNoteBtn {
      width: 100%;
      margin-bottom: 20px;
    }

    .note-list {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: 300px;
      overflow-y: auto;
    }

    .note-list li {
      background: #f3f0fb;
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 8px;
      color: #6b6180;
      font-size: 0.9rem;
      word-break: break-word;
    }

    .empty-message {
      text-align: center;
      color: #b3a2bb;
      font-size: 0.85rem;
      padding: 20px 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div id="lockScreen">
      <h1 id="lockTitle">🔒 비밀 메모장</h1>
      <p class="intro" id="lockIntro">비밀번호를 입력해 메모장을 열어보세요</p>
      <div class="lock-row">
        <input type="password" id="passwordInput" placeholder="비밀번호">
        <button type="button" id="unlockBtn">열기</button>
      </div>
      <p class="error-message" id="errorMessage"></p>
    </div>

    <div id="noteApp">
      <h1>📝 비밀 메모장</h1>
      <p class="intro">오늘의 생각을 자유롭게 적어보세요</p>
      <textarea id="noteInput" placeholder="메모를 입력하세요"></textarea>
      <button type="button" id="addNoteBtn">메모 추가</button>
      <ul class="note-list" id="noteList">
        <li class="empty-message" id="emptyMessage">아직 작성된 메모가 없어요</li>
      </ul>
    </div>
  </div>

  <script>
    const PASSWORD_STORAGE_KEY = 'secretNotePassword';

    const lockScreen = document.getElementById('lockScreen');
    const lockTitle = document.getElementById('lockTitle');
    const lockIntro = document.getElementById('lockIntro');
    const noteApp = document.getElementById('noteApp');
    const passwordInput = document.getElementById('passwordInput');
    const unlockBtn = document.getElementById('unlockBtn');
    const errorMessage = document.getElementById('errorMessage');

    // ① 수정: 하드코딩된 비밀번호 대신, 첫 실행 시 사용자가 직접 정한 비밀번호를 저장해서 사용
    function isFirstRun() {
      return localStorage.getItem(PASSWORD_STORAGE_KEY) === null;
    }

    function setupLockScreenLabels() {
      if (isFirstRun()) {
        lockTitle.textContent = '🔒 비밀번호 설정';
        lockIntro.textContent = '처음 사용하시네요! 메모장에서 사용할 비밀번호를 정해주세요';
        passwordInput.placeholder = '사용할 비밀번호';
        unlockBtn.textContent = '설정하기';
      } else {
        lockTitle.textContent = '🔒 비밀 메모장';
        lockIntro.textContent = '비밀번호를 입력해 메모장을 열어보세요';
        passwordInput.placeholder = '비밀번호';
        unlockBtn.textContent = '열기';
      }
    }

    function openNoteApp() {
      lockScreen.style.display = 'none';
      noteApp.style.display = 'block';
    }

    function tryUnlock() {
      const value = passwordInput.value;
      if (!value) {
        errorMessage.textContent = '비밀번호를 입력해주세요.';
        return;
      }

      if (isFirstRun()) {
        localStorage.setItem(PASSWORD_STORAGE_KEY, value);
        openNoteApp();
        return;
      }

      const isCorrect = value === localStorage.getItem(PASSWORD_STORAGE_KEY);
      if (isCorrect) {
        openNoteApp();
      } else {
        errorMessage.textContent = '비밀번호가 올바르지 않습니다.';
      }
    }

    setupLockScreenLabels();
    unlockBtn.addEventListener('click', tryUnlock);
    passwordInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') tryUnlock();
    });

    const noteInput = document.getElementById('noteInput');
    const addNoteBtn = document.getElementById('addNoteBtn');
    const noteList = document.getElementById('noteList');
    const emptyMessage = document.getElementById('emptyMessage');

    let notes = [];

    // ② 수정: innerHTML 대신 textContent로 렌더링해 사용자 입력이 HTML로 해석되지 않도록 처리
    function renderNotes() {
      noteList.querySelectorAll('li:not(.empty-message)').forEach(li => li.remove());
      emptyMessage.style.display = notes.length === 0 ? 'block' : 'none';

      notes.forEach(note => {
        const li = document.createElement('li');
        li.textContent = note;
        noteList.appendChild(li);
      });
    }

    addNoteBtn.addEventListener('click', () => {
      const value = noteInput.value.trim();
      if (!value) return;
      notes.push(value);
      noteInput.value = '';
      renderNotes();
    });

    renderNotes();
  </script>
</body>
</html>
