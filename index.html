<!--
  연습용 파일입니다. 초보자가 자주 하는 실수 3가지를 의도적으로 포함했습니다:
  1) <head>에 <title> 태그가 없음
  2) <img>에 alt 속성이 없음
  3) 모바일 대응을 위한 viewport 메타 태그가 없음
-->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ffe4ec 0%, #e6e6fa 50%, #d6f5f0 100%);
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      padding: 40px 20px;
    }

    .card {
      background: #fffafc;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(200, 170, 220, 0.35);
      padding: 40px 32px;
      max-width: 360px;
      width: 100%;
      text-align: center;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 4px solid #ffd6e8;
      background: #fef3f8;
      object-fit: cover;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 8px;
      color: #7a5c7e;
      font-size: 1.6rem;
    }

    .intro {
      color: #a98bb0;
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    .favorites {
      text-align: left;
      background: #f3f0fb;
      border-radius: 16px;
      padding: 20px 24px;
      list-style: none;
      margin: 0;
    }

    .favorites li {
      color: #6b6180;
      font-size: 0.95rem;
      padding: 6px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .favorites li::before {
      content: "🌸";
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="avatar" src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Ccircle cx='60' cy='60' r='60' fill='%23ffe4ec'/%3E%3Ccircle cx='60' cy='48' r='22' fill='%23fff5f8'/%3E%3Cpath d='M20 110c6-28 26-42 40-42s34 14 40 42' fill='%23fff5f8'/%3E%3C/svg%3E">
    <h1>문정</h1>
    <p class="intro">코드와 커피를 사랑하는 개발자입니다.</p>
    <ul class="favorites">
      <li>파스텔 색감 디자인</li>
      <li>주말 카페 투어</li>
      <li>고양이 영상 보기</li>
    </ul>
  </div>
</body>
</html>
