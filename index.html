<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>문정</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ffe4ec 0%, #e6e6fa 50%, #d6f5f0 100%);
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      padding: 40px 20px;
    }

    .card {
      background: #fffafc;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(200, 170, 220, 0.35);
      padding: 40px 32px;
      max-width: 360px;
      width: 100%;
      text-align: center;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 4px solid #ffd6e8;
      background: #fef3f8;
      object-fit: cover;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 8px;
      color: #7a5c7e;
      font-size: 1.6rem;
    }

    .intro {
      color: #806a87;
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    .favorites {
      text-align: left;
      background: #f3f0fb;
      border-radius: 16px;
      padding: 20px 24px;
      list-style: none;
      margin: 0;
    }

    .favorites li {
      color: #6b6180;
      font-size: 0.95rem;
      padding: 6px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .favorites li::before {
      content: "🌸";
    }

    .quote-section {
      margin-top: 24px;
      background: #fdf6fa;
      border-radius: 16px;
      padding: 20px;
      border: 1px solid #f9e8f0;
    }

    .quote-title {
      color: #7a5c7e;
      font-size: 1rem;
      margin: 0 0 14px;
      font-weight: 600;
    }

    .quote-buttons {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 14px;
    }

    .quote-btn {
      background: #ffffff;
      border: 1.5px solid #ffd6e8;
      border-radius: 20px;
      padding: 8px 14px;
      font-size: 0.85rem;
      color: #6b6180;
      cursor: pointer;
      font-family: inherit;
      font-weight: 500;
      transition: all 0.2s ease;
      outline: none;
    }

    .quote-btn:hover {
      background: #ffe4ec;
      border-color: #f7a8c4;
      transform: translateY(-2px);
    }

    .quote-btn.active {
      background: #7a5c7e;
      color: #ffffff;
      border-color: #7a5c7e;
      box-shadow: 0 4px 12px rgba(122, 92, 126, 0.25);
    }

    .quote-display {
      background: #ffffff;
      border-radius: 12px;
      padding: 14px 16px;
      color: #5a4b66;
      font-size: 0.9rem;
      line-height: 1.5;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      border: 1px solid #f0e6f5;
      transition: opacity 0.25s ease;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="avatar" src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Ccircle cx='60' cy='60' r='60' fill='%23ffe4ec'/%3E%3Ccircle cx='60' cy='48' r='22' fill='%23fff5f8'/%3E%3Cpath d='M20 110c6-28 26-42 40-42s34 14 40 42' fill='%23fff5f8'/%3E%3C/svg%3E" alt="문정 프로필 아바타">
    <h1>문정 | Developer</h1>
    <p class="intro">커피 한 잔으로 좋은 코드를 만드는 개발자예요.</p>
    <ul class="favorites">
      <li>파스텔 색감 디자인</li>
      <li>주말 카페 투어</li>
      <li>고양이 영상 보기</li>
    </ul>
    <div class="quote-section">
      <h2 class="quote-title">오늘의 한마디</h2>
      <div class="quote-buttons">
        <button type="button" class="quote-btn" data-quote="포기하지 않는 한 실패는 없습니다. 두려워 말고 도전해보세요! 💪">💪 용기</button>
        <button type="button" class="quote-btn" data-quote="작은 성공들이 모여 큰 변화를 만듭니다. 오늘도 성장하고 있어요! 🌱">🌱 성장</button>
        <button type="button" class="quote-btn" data-quote="당신의 노력은 반드시 빛을 발할 거예요. 언제나 응원합니다! 🌈">🌈 응원</button>
      </div>
      <div class="quote-display" id="quoteDisplay">버튼을 눌러 응원 문구를 확인해보세요!</div>
    </div>
  </div>
  <script>
    const buttons = document.querySelectorAll('.quote-btn');
    const quoteDisplay = document.getElementById('quoteDisplay');

    buttons.forEach(button => {
      button.addEventListener('click', () => {
        buttons.forEach(btn => btn.classList.remove('active'));
        button.classList.add('active');

        quoteDisplay.style.opacity = '0';
        setTimeout(() => {
          quoteDisplay.textContent = button.getAttribute('data-quote');
          quoteDisplay.style.opacity = '1';
        }, 150);
      });
    });
  </script>
</body>
</html>
